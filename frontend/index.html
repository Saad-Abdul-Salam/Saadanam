<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saadanam — Business Made Simple</title>
    <meta name="description" content="Saadanam is a simple billing, stock and shop-management platform for small businesses — create invoices in seconds, track stock in real time, and understand your business with clear reports." />
    <meta name="theme-color" content="#1b3b2b" />
    <meta name="apple-mobile-web-app-title" content="Saadanam" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Saadanam — Business Made Simple" />
    <meta property="og:description" content="Billing, stock, purchases, customers and reports — everything a shop needs in one simple place." />
    <meta property="og:image" content="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&family=Kaushan+Script&display=swap"
        rel="stylesheet"
    />
    <style>
        /* Animated splash shown while the app bundle loads — removed by main.jsx */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background-color: #f7f4ee;
            transition: opacity 0.3s ease;
        }

        #splash.splash-hide {
            opacity: 0;
            pointer-events: none;
        }

        #splash img {
            width: 132px;
            height: auto;
            animation: splash-pulse 1.6s ease-in-out infinite;
        }

        #splash .splash-dots {
            display: flex;
            gap: 7px;
        }

        #splash .splash-dots span {
            width: 9px;
            height: 9px;
            border-radius: 9999px;
            background-color: #1b3b2b;
            animation: splash-bounce 1.1s ease-in-out infinite;
        }

        #splash .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
        #splash .splash-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes splash-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.85; }
        }

        @keyframes splash-bounce {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-7px); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            #splash img, #splash .splash-dots span { animation: none; }
        }
    </style>
</head>

<body>
    <div id="splash" aria-hidden="true">
        <img src="/favicon.png" alt="" />
        <div class="splash-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <div id="root"></div>
    <script>
        // Safety net: never leave the splash up for more than 6 seconds,
        // even if the app fails to mount.
        setTimeout(function () {
            var s = document.getElementById('splash')
            if (s) {
                s.classList.add('splash-hide')
                setTimeout(function () { s.remove() }, 350)
            }
        }, 6000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
